    <script>
      // Apply the saved theme before first paint so light-mode visitors
      // don't see a flash of the dark theme while React boots.
      try {
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("theme") || "light"
        );
      } catch (e) {}
    </script>
